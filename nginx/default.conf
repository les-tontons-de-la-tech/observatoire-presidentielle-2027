server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirections de dossier RELATIVES : nginx ne connaît que le chemin après le préfixe
    # /observatoire monté par Caddy ; une redirection absolue perdrait le schéma https et le préfixe.
    absolute_redirect off;

    # Pages régénérées chaque jour : le navigateur doit revalider (ETag, 304 si inchangé),
    # sinon un lecteur — ou l'auteur — peut rester sur la version de la veille.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
