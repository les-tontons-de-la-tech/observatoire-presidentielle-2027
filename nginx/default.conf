server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirections de dossier RELATIVES : nginx ne connaît que le chemin après le préfixe
    # /observatoire monté par Traefik ; une redirection absolue perdrait le schéma https et le préfixe.
    absolute_redirect off;

    # Pages régénérées chaque jour : le navigateur doit revalider (ETag, 304 si inchangé),
    # sinon un lecteur — ou l'auteur — peut rester sur la version de la veille.
    add_header Cache-Control "no-cache" always;

    # Compression (audit Ahrefs du 17/09/2026 : « Not compressed » sur les six pages de
    # l'observatoire). Ces pages portent leur CSS, leurs SVG et leurs tableaux en ligne :
    # ~54 Ko par page servis tels quels. `gzip_vary` est indispensable — sans lui, un cache
    # intermédiaire peut resservir la version compressée à un client qui ne la comprend pas.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/xml
               application/xhtml+xml image/svg+xml application/javascript application/json
               text/csv;

    location / {
        try_files $uri $uri/ =404;
    }

    # Jeux de données de l'observatoire (19/10/2026, audit GEO) : un CSV servi en
    # application/octet-stream oblige le client à deviner le format. Le bloc `types` est
    # posé DANS la location : au niveau serveur, il remplacerait toute la table MIME et
    # les pages HTML partiraient sans type.
    location ~ \.csv$ {
        types { text/csv csv; }
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
